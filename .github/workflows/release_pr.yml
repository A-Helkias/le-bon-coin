name: "Release pull request"

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  # --- Promotion dev -> main --------------------------------------------------

  release-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Écart entre dev et main
        run: |
          AHEAD=$(git rev-list --count origin/main..origin/dev)
          echo "AHEAD=${AHEAD}" >> "$GITHUB_ENV"
          echo "${AHEAD} commit(s) à promouvoir"

      - name: Corps de la pull request
        if: env.AHEAD != '0'
        run: |
          {
            echo "Promotion de \`dev\` vers \`main\`. La fusion déclenche le déploiement en production, puis le tag et la release."
            echo
            echo "## Commits (${AHEAD})"
            echo
            git log --no-merges --pretty='- %s' origin/main..origin/dev
          } > body.md

      - name: Créer ou mettre à jour la PR
        if: env.AHEAD != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NUM=$(gh pr list --base main --head dev --state open --json number -q '.[0].number')
          if [ -n "$NUM" ]; then
            gh pr edit "$NUM" --body-file body.md
            echo "PR #${NUM} mise à jour"
          else
            gh pr create --base main --head dev \
              --title "Release — promotion de dev vers main" \
              --body-file body.md \
              --label release
            echo "PR de release créée"
          fi
