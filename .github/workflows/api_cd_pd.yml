name: "API deployment in prod"

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - ".github/workflows/api_cd_pd.yml"
  workflow_dispatch:

env:
  TAG_PREFIX: prod

jobs:
  # --- Testing ---------------------------------------------------------------

  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: le_bon_coin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Dépendances backend
        working-directory: backend
        run: uv sync --frozen

      - name: Lint, types et tests backend
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/le_bon_coin_test
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy app
          uv run pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dépendances frontend
        working-directory: frontend
        run: npm ci

      - name: Lint, types et tests frontend
        working-directory: frontend
        run: |
          npm run lint
          npx tsc --noEmit
          npx vitest run

  # --- Build et publication de l'image ---------------------------------------

  build:
    needs: check
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.tags.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - name: Tags de l'image
        id: tags
        run: |
          BASE="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/api"
          echo "image=${BASE}:${TAG_PREFIX}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "IMAGE=${BASE}:${TAG_PREFIX}-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "IMAGE_MOVING=${BASE}:${TAG_PREFIX}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et pousser
        run: |
          docker build -f docker/Dockerfile -t "$IMAGE" -t "$IMAGE_MOVING" .
          docker push "$IMAGE"
          docker push "$IMAGE_MOVING"

  # --- Déploiement -----------------------------------------------------------

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: production
      url: ${{ vars.SERVICE_URL }}

    steps:
      - name: Déclencher le déploiement
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          DEPLOY_ID=$(curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "{\"imageUrl\":\"${IMAGE}\"}" \
            "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          echo "DEPLOY_ID=${DEPLOY_ID}" >> "$GITHUB_ENV"
          echo "Déploiement ${DEPLOY_ID} lancé pour ${IMAGE}"

      - name: Attendre la mise en ligne
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          for _ in $(seq 40); do
            STATUS=$(curl --fail --silent \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              "https://api.render.com/v1/services/${SERVICE_ID}/deploys/${DEPLOY_ID}" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
            echo "statut : ${STATUS}"
            case "$STATUS" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed)
                echo "Déploiement en échec : ${STATUS}" >&2; exit 1 ;;
            esac
            sleep 15
          done
          echo "Délai dépassé" >&2; exit 1

      - name: Vérifier le service
        run: curl --fail --retry 5 --retry-delay 10 --retry-all-errors "${{ vars.SERVICE_URL }}/health"
